version: '3.8'

services:
  mariadb:
    image: mariadb:10.11
    container_name: f1-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: f1_weekends
      MYSQL_USER: f1user
      MYSQL_PASSWORD: f1password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./server/database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./server/database/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql
    networks:
      - f1-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: f1-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: mariadb
      DB_USER: f1user
      DB_PASSWORD: f1password
      DB_NAME: f1_weekends
    depends_on:
      - mariadb
    networks:
      - f1-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: f1-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - f1-network

networks:
  f1-network:
    driver: bridge

volumes:
  mariadb_data:
